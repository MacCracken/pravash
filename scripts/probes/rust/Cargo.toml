[package]
name = "pravash-probes"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false
description = "M0 step 9 probes on the frozen Rust pravash 1.3.0 oracle (rust-old/)"

# The oracle by path, never edited (CLAUDE.md). Cargo.lock was seeded from scripts/oracle/Cargo.lock,
# itself seeded from rust-old/Cargo.lock, so hisab is exactly 1.4.0 (and glam 0.29.3).
[dependencies]
pravash = { path = "../../../rust-old", default-features = false, features = [
    "oracle", "sph", "grid", "shallow", "buoyancy", "vortex", "coupling", "compute", "ai",
] }
hisab = { version = "=1.4.0", features = ["num", "geo", "autodiff"] }
# serde_json for bench_common's json/* rows: the oracle's version, with the generator's float_roundtrip parse.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# tracing and tracing-subscriber for bench_logging_b's rows: the oracle's versions (a disabled span, a span into a
# do-nothing subscriber, EnvFilter's parse).
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "std", "registry"] }

# Probe 6 builds p6_parallel twice, without and with rayon, and compares the two outputs.
[features]
parallel = ["pravash/parallel"]

[profile.release]
overflow-checks = true
