name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — the release-integrity hardening item)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Test (bounds-checked)
        run: cyrius test --bounds

      - name: Lockfile matches lib/
        run: cyrius deps --locked

      - name: Audit (fmt, lint, test, bench)
        run: cyrius audit

      - name: Conversion ledger (every stand-in marked, every note on a ledger row)
        run: python3 -I -B scripts/upstream_ledger.py --check

      - name: Surface parity (every public Rust item has its Cyrius counterpart, and every public Cyrius name a Rust item or a recorded reason)
        run: python3 -I -B scripts/surface_parity.py .

      - name: Rust-test ledger (every Rust test ported to a same-named group, or recorded with its reason)
        run: python3 -I -B scripts/rust_test_ledger.py . --check

      - name: Bundle current (dist/pravash.cyr is what distlib writes from [lib])
        run: cyrius distlib --check

      - name: Doc examples (every cyrius block in the README and guides, and each docs/examples program against its .out)
        run: python3 -I -B scripts/doc_examples.py .

      - name: Fuzz (tests/pravash.fcyr, the JSON readers and the PRAVASH_LOG parser)
        run: cyrius fuzz tests/pravash.fcyr

  rust-oracle:
    # The frozen Rust 1.3.0 crate in rust-old/ is the parity oracle. It is
    # never edited; this job only proves it still builds and passes, with and
    # without `parallel` (port plan, M0 step 0).
    name: Rust oracle (frozen, rust-old/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned)
      - name: Install the oracle's Rust (the root rust-toolchain.toml names it)
        # Not `stable`, which has moved past the oracle's toolchain; the version is written in rust-toolchain.toml only.
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Oracle tests with parallel
        run: cargo test --locked --manifest-path rust-old/Cargo.toml --all-features
      - name: Oracle hooks without parallel
        run: cargo test --locked --manifest-path rust-old/Cargo.toml --features oracle,coupling --test oracle
