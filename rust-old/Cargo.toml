[package]
name = "pravash"
version = "1.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Fluid dynamics simulation — SPH, Euler/Navier-Stokes, shallow water, buoyancy, drag, vortex dynamics"
homepage = "https://github.com/MacCracken/pravash"
repository = "https://github.com/MacCracken/pravash"
readme = "README.md"
documentation = "https://docs.rs/pravash"
keywords = ["fluid", "simulation", "physics", "sph", "navier-stokes"]
categories = ["science", "simulation"]
exclude = [".claude/", ".github/", "docs/", "scripts/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["sph", "grid", "shallow"]
sph = []
grid = []
shallow = []
buoyancy = []
vortex = []
coupling = []
compute = ["sph"]
parallel = ["dep:rayon"]
ai = []
logging = ["dep:tracing-subscriber", "dep:tracing-chrome"]
full = ["sph", "grid", "shallow", "buoyancy", "vortex", "coupling", "compute", "parallel", "ai", "logging"]
# Hidden, read-only state access for the Cyrius port's golden-value generator
# (docs/development/pravash-port-plan.md, M0 step 0). Not public API; not in `full`.
oracle = []

[dependencies]
hisab = { version = "1.4", features = ["num", "geo", "autodiff"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

# Optional
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
tracing-chrome = { version = "0.7.2", optional = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
required-features = ["sph", "grid", "shallow", "coupling"]

[[test]]
name = "integration"
required-features = ["sph", "grid", "shallow", "buoyancy", "vortex", "coupling"]

[[test]]
name = "oracle"
required-features = ["oracle", "sph", "grid", "shallow", "coupling"]

[[example]]
name = "basic_fluid"
required-features = ["sph"]

[[example]]
name = "shallow_water"
required-features = ["shallow"]

[[example]]
name = "multiphase"
required-features = ["sph"]
